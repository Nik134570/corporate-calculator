services:
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: app_backend
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss && (node prisma/seed.js || echo 'Seed skipped') && node server.js"

  frontend:
    build:
      context: ./calculator
    container_name: app_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
      PORT: 80
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: